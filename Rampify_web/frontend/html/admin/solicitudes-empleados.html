<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitudes de empleados · Rampify · Rampify</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/auth.css"><link rel="stylesheet" href="../../css/app.css">
</head>
<body data-role="Administrador del sistema" data-page="sol-empleados">
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand__logo" aria-hidden="true">R</div><div><div class="brand__name">Rampify</div><div class="brand__tag">Accesibilidad urbana</div></div></div>
    <nav class="nav" data-nav aria-label="Menú principal"></nav>
  </aside>
  <div class="main">
    <header class="topbar"><span class="brand__tag" style="color:var(--color-text-muted)">Panel de administración</span>
      <div class="topbar__user"><div><strong data-user-name></strong><span class="topbar__role" data-user-role></span></div>
        <button class="btn btn--ghost" type="button" data-action="logout">Cerrar sesión</button></div></header>
    <main class="content">
      <h1 class="page-title">Solicitudes de empleados</h1>
      <div class="split">
        <section class="card" data-form="lista">
          <div data-alert hidden role="alert" aria-live="polite"></div>
          <table class="table table--emp"><thead><tr><th>Nombre</th><th>Correo</th><th>Fecha</th></tr></thead><tbody data-list></tbody></table>
          <p class="field__hint" data-empty hidden style="padding:var(--sp-4)"></p>
          <div class="pager"><button class="btn btn--ghost" type="button" data-action="prev">← Anterior</button><span data-page-info></span><button class="btn btn--ghost" type="button" data-action="next">Siguiente →</button></div>
        </section>
        <section class="card" data-detail hidden>
          <h2 class="card__title" data-d="nombre"></h2>
          <dl class="facts" data-d="facts"></dl>
          <form data-form="aprobar" novalidate>
            <div data-alert hidden role="alert" aria-live="polite"></div>
            <button class="btn btn--primary" type="submit" data-submit>Aprobar</button>
          </form>
          <form class="detail__form" data-form="rechazo" novalidate>
            <h3 class="card__title">Rechazar petición</h3>
            <div class="field"><label class="field__label" for="m-motivo">Motivo del rechazo (de 10 a 200 caracteres)</label><textarea class="input" id="m-motivo" name="motivo" rows="3" maxlength="200"></textarea></div>
            <div data-alert hidden role="alert" aria-live="polite"></div>
            <button class="btn btn--danger" type="submit" data-submit>Rechazar</button>
          </form>
        </section>
      </div>
    </main>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="../../js/config.js"></script><script src="../../js/messages.js"></script><script src="../../js/rate-limit.js"></script>
<script src="../../js/api.js"></script><script src="../../js/app.js"></script><script src="../../js/solicitudes-empleados.js"></script>
</body>
</html>
