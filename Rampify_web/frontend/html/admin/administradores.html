<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administradores · Rampify · Rampify</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/auth.css"><link rel="stylesheet" href="../../css/app.css">
</head>
<body data-role="Administrador del sistema" data-page="admins">
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand__logo" aria-hidden="true">R</div><div><div class="brand__name">Rampify</div><div class="brand__tag">Accesibilidad urbana</div></div></div>
    <nav class="nav" data-nav aria-label="Menú principal"></nav>
  </aside>
  <div class="main">
    <header class="topbar"><span class="brand__tag" style="color:var(--color-text-muted)">Panel de administración</span>
      <div class="topbar__user"><div><strong data-user-name></strong><span class="topbar__role" data-user-role></span></div>
        <button class="btn btn--ghost" type="button" data-action="logout">Cerrar sesión</button></div></header>
    <main class="content">
      <h1 class="page-title">Administradores</h1>
      <form class="card" data-form="invitar" novalidate style="max-width:34rem">
        <h2 class="card__title">Invitar administrador</h2>
        <p class="subtitle" style="margin-bottom:var(--sp-5)">La persona recibirá un enlace de un solo uso, válido por 24 horas, para completar su registro. Los demás administradores recibirán un aviso.</p>
        <div class="field"><label class="field__label" for="i-correo">Correo electrónico del invitado</label>
          <input class="input" id="i-correo" name="correo" type="email" autocomplete="off" maxlength="254" placeholder="nombre@ejemplo.com">
          <p class="field__error" data-error-for="correo" role="alert"></p></div>
        <div class="field"><label class="field__label" for="i-pass">Tu contraseña (para confirmar)</label>
          <div class="field__control"><input class="input input--has-icon" id="i-pass" name="contrasena" type="password" autocomplete="current-password" maxlength="64">
            <button type="button" class="icon-btn" data-action="toggle-password" aria-label="Mostrar contraseña"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          <p class="field__error" data-error-for="contrasena" role="alert"></p></div>
        <div data-alert hidden role="alert" aria-live="polite"></div>
        <button class="btn btn--primary" type="submit" data-submit>Enviar invitación <span aria-hidden="true">→</span></button>
      </form>
    </main>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="../../js/config.js"></script><script src="../../js/messages.js"></script><script src="../../js/validators.js"></script><script src="../../js/rate-limit.js"></script>
<script src="../../js/api.js"></script><script src="../../js/app.js"></script><script src="../../js/administradores.js"></script>
</body>
</html>
