<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Rampify</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/auth.css"><link rel="stylesheet" href="../../css/app.css">
</head>
<body data-role="Administrador del sistema" data-page="dashboard">
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand__logo" aria-hidden="true">R</div><div><div class="brand__name">Rampify</div><div class="brand__tag">Accesibilidad urbana</div></div></div>
    <nav class="nav" data-nav aria-label="Menú principal"></nav>
  </aside>
  <div class="main">
    <header class="topbar"><span class="brand__tag" style="color:var(--color-text-muted)">Panel de administración</span>
      <div class="topbar__user"><div><strong data-user-name></strong><span class="topbar__role" data-user-role></span></div>
        <button class="btn btn--ghost" type="button" data-action="logout">Cerrar sesión</button></div></header>
    <main class="content">
      <h1 class="page-title">Dashboard</h1>
      <form class="card" data-form="filtros" novalidate>
        <div class="filters">
          <div class="field"><label class="field__label" for="f-desde">Fecha inicial</label><input class="input" id="f-desde" name="desde" type="date"></div>
          <div class="field"><label class="field__label" for="f-hasta">Fecha final</label><input class="input" id="f-hasta" name="hasta" type="date"></div>
          <div class="field"><label class="field__label" for="f-estado">Estado</label><select class="input" id="f-estado" name="estado"><option value="">Todos</option></select></div>
          <div class="field"><label class="field__label" for="f-tipo">Tipo de problema</label><select class="input" id="f-tipo" name="tipo"><option value="">Todos</option></select></div>
          <div class="filters__actions"><button class="btn btn--primary" type="submit" data-submit>Aplicar</button>
            <button class="btn btn--ghost" type="button" data-action="reset-filtros">Últimos 30 días</button></div>
        </div>
        <div data-alert hidden role="alert" aria-live="polite" style="margin:var(--sp-4) 0 0"></div>
      </form>
      <section class="kpis">
        <div class="card"><div class="kpi__value" data-kpi="total">–</div><div class="kpi__label">Reportes en el periodo</div></div>
        <div class="card"><div class="kpi__value" data-kpi="usuarios">–</div><div class="kpi__label">Usuarios en estado Activa</div></div>
      </section>
      <section class="grid-2">
        <div class="card"><h2 class="card__title">Reportes por estado</h2><div class="bars" data-chart="estado"></div></div>
        <div class="card"><h2 class="card__title">Reportes por tipo de problema</h2><div class="bars" data-chart="tipo"></div></div>
      </section>
      <section class="card"><h2 class="card__title">Reportes por día</h2><div data-chart="dia"></div></section>
      <section class="card"><h2 class="card__title">Mapa de concentración de reportes</h2><div class="map" data-map></div></section>
    </main>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="../../js/config.js"></script><script src="../../js/messages.js"></script><script src="../../js/rate-limit.js"></script>
<script src="../../js/api.js"></script><script src="../../js/app.js"></script><script src="../../js/dashboard.js"></script>
</body>
</html>
