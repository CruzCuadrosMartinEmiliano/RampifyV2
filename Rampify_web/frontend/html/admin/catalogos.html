<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogos · Rampify</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/auth.css"><link rel="stylesheet" href="../../css/app.css">
</head>
<body data-role="Administrador del sistema" data-page="catalogos">
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand__logo" aria-hidden="true">R</div><div><div class="brand__name">Rampify</div><div class="brand__tag">Accesibilidad urbana</div></div></div>
    <nav class="nav" data-nav aria-label="Menú principal"></nav>
  </aside>
  <div class="main">
    <header class="topbar"><span class="brand__tag" style="color:var(--color-text-muted)">Panel de administración</span>
      <div class="topbar__user"><div><strong data-user-name></strong><span class="topbar__role" data-user-role></span></div>
        <button class="btn btn--ghost" type="button" data-action="logout">Cerrar sesión</button></div></header>
    <main class="content">
      <h1 class="page-title">Catálogos</h1>
      <div class="split">
        <section class="card" data-form="lista">
          <div data-alert hidden role="alert" aria-live="polite"></div>
          <div class="inline-filter"><label for="c-catalogo">Catálogo:</label>
            <select class="input" id="c-catalogo" data-filter="catalogo"><option value="tipos-problema">Tipos de problema</option></select></div>
          <table class="table table--cat"><thead><tr><th>Elemento</th></tr></thead><tbody data-list></tbody></table>
          <p class="field__hint" data-empty hidden style="padding:var(--sp-4)"></p>
          <p class="field__hint" data-count style="padding:var(--sp-3)"></p>
        </section>
        <div class="stack">
          <form class="card" data-form="agregar" novalidate>
            <h2 class="card__title">Agregar elemento</h2>
            <div class="field"><label class="field__label" for="c-nombre-nuevo">Nombre del elemento (de 2 a 60 caracteres)</label>
              <input class="input" id="c-nombre-nuevo" name="nombre" type="text" autocomplete="off" maxlength="200">
              <p class="field__error" data-error-for="nombre" role="alert"></p></div>
            <div data-alert hidden role="alert" aria-live="polite"></div>
            <button class="btn btn--primary" type="submit" data-submit>Guardar</button>
          </form>
          <section class="card" data-detail hidden>
            <h2 class="card__title" data-d="titulo"></h2>
            <form data-form="editar" novalidate>
              <div class="field"><label class="field__label" for="c-nombre-edit">Nuevo nombre (de 2 a 60 caracteres)</label>
                <input class="input" id="c-nombre-edit" name="nombre" type="text" autocomplete="off" maxlength="200">
                <p class="field__error" data-error-for="nombre" role="alert"></p></div>
              <div data-alert hidden role="alert" aria-live="polite"></div>
              <button class="btn btn--primary" type="submit" data-submit>Guardar</button>
            </form>
            <form class="detail__form" data-form="eliminar" novalidate>
              <h3 class="card__title">Eliminar elemento</h3>
              <div data-alert hidden role="alert" aria-live="polite"></div>
              <button class="btn btn--danger" type="submit" data-submit>Eliminar</button>
            </form>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../../js/config.js"></script><script src="../../js/messages.js"></script><script src="../../js/rate-limit.js"></script>
<script src="../../js/api.js"></script><script src="../../js/app.js"></script><script src="../../js/catalogos.js"></script>
</body>
</html>
